[project]
name = "localforge-inference-lab"
version = "0.1.0"
description = "Local-first LLM inference benchmarking workbench"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=1.0",
    "keyring>=25.6",
    "psutil>=6.1.0",
    "python-multipart>=0.0.32",
    "uvicorn>=0.34",
]

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-psutil>=7.2.2.20260906",
]

[project.scripts]
localforge-worker = "localforge.worker.__main__:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/localforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
packages = ["localforge"]
